# Grade semanal: 0 = segunda ... 6 = domingo
dias:
  0: conceito
  1: erro
  2: exemplo
  3: livro
  4: checklist
  5: comparativo
  6: reflexao

pilares:
  conceito: { formato: carrossel, min: 6, max: 8 }
  erro: { formato: post_unico, min: 1, max: 1 }
  exemplo: { formato: carrossel, min: 7, max: 10 }
  livro: { formato: carrossel, min: 5, max: 7 }
  checklist: { formato: carrossel, min: 5, max: 6 }
  comparativo: { formato: carrossel, min: 5, max: 7 }
  reflexao: { formato: post_unico, min: 1, max: 1 }
  atualidade: { formato: carrossel, min: 5, max: 7 }
  evento: { formato: carrossel, min: 5, max: 8 }

atualidades_max_por_semana: 2
