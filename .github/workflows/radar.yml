name: Radar de notícias

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Coletar manchetes
        run: python scripts/radar.py
      - name: Atualizar dados econômicos
        run: python scripts/dados_economicos.py
        continue-on-error: true
      - name: Salvar
        run: |
          git config user.name "l3-radar[bot]"
          git config user.email "l3-radar@users.noreply.github.com"
          git add pesquisa/radar dados
          git diff --cached --quiet || { git commit -m "Radar do dia" && git pull --rebase && git push; }
