name: Entregar no Telegram

on:
  # De hora em hora, das 08:17 às 23:17 em Brasília, fora do minuto cheio.
  # O GitHub atrasa ou pula horários agendados; cada execução entrega o que já
  # passou do horário do perfil (config/limites.yaml) e ainda não foi enviado.
  schedule:
    - cron: "17 11-23 * * *"
    - cron: "17 0-2 * * *"
  # Merge de post em main: entrega na hora o que tiver a data de hoje (/hoje).
  push:
    branches: [main]
    paths: ["fila/**"]
  workflow_dispatch:
    inputs:
      perfil:
        description: Perfil
        type: choice
        options: [FIN, MKT]
        required: true
      dry_run:
        description: Só simular
        type: boolean
        default: false
      janela:
        description: Janela
        type: choice
        options: [normal, evento]
        default: normal
      data:
        description: Entregar outro dia (AAAA-MM-DD); vazio para hoje
        type: string
        required: false

permissions:
  contents: write
  issues: write

# Fila única: execuções nunca rodam em paralelo. Uma execução pendente
# substituída por outra não faz falta, pois a seguinte cobre os dois perfis.
concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  entregar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Configurar autor dos commits
        run: |
          git config user.name "l3-telegram[bot]"
          git config user.email "l3-telegram@users.noreply.github.com"
      - name: Entregar
        env:
          EVENTO: ${{ github.event_name }}
          PERFIL: ${{ inputs.perfil }}
          JANELA: ${{ inputs.janela || 'normal' }}
          DATA: ${{ inputs.data }}
          SIMULAR: ${{ inputs.dry_run }}
          ENTREGA_TELEGRAM: ${{ vars.ENTREGA_TELEGRAM }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then perfis=("$PERFIL"); else perfis=(FIN MKT); fi
          extra=(--janela "$JANELA")
          if [ -n "$DATA" ]; then extra+=(--data "$DATA"); fi
          if [ "$SIMULAR" = "true" ]; then extra+=(--dry-run); fi
          if [ "$EVENTO" = "schedule" ]; then extra+=(--respeitar-horario); fi
          falhou=0
          for p in "${perfis[@]}"; do
            python scripts/entregar_telegram.py "$p" "${extra[@]}" || falhou=1
          done
          exit $falhou
