name: Publicar

on:
  schedule:
    - cron: "30 11 * * *" # 08:30 BRT: FIN
    - cron: "30 15 * * *" # 12:30 BRT: MKT
    - cron: "0 21 * * *" # 18:00 BRT: FIN, só posts de evento
  workflow_dispatch:
    inputs:
      perfil:
        description: Perfil
        type: choice
        options: [FIN, MKT]
        required: true
      dry_run:
        description: Só simular
        type: boolean
        default: true
      janela:
        description: Janela
        type: choice
        options: [normal, evento]
        default: normal
      data:
        description: Republicar um dia (AAAA-MM-DD); vazio para hoje
        type: string
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar-${{ inputs.perfil || (github.event.schedule == '30 15 * * *' && 'MKT' || 'FIN') }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Configurar autor dos commits
        run: |
          git config user.name "l3-publicador[bot]"
          git config user.email "l3-publicador@users.noreply.github.com"
      - name: Publicar
        env:
          PERFIL: ${{ inputs.perfil || (github.event.schedule == '30 15 * * *' && 'MKT' || 'FIN') }}
          JANELA: ${{ inputs.janela || (github.event.schedule == '0 21 * * *' && 'evento' || 'normal') }}
          DATA: ${{ inputs.data }}
          SIMULAR: ${{ inputs.dry_run }}
          PUBLICACAO_ATIVA: ${{ vars.PUBLICACAO_ATIVA }}
          GH_TOKEN: ${{ github.token }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          IG_USER_ID_FIN: ${{ secrets.IG_USER_ID_FIN }}
          IG_USER_ID_MKT: ${{ secrets.IG_USER_ID_MKT }}
          IG_TOKEN_FIN: ${{ secrets.IG_TOKEN_FIN }}
          IG_TOKEN_MKT: ${{ secrets.IG_TOKEN_MKT }}
        run: |
          args=("$PERFIL" --janela "$JANELA")
          if [ -n "$DATA" ]; then args+=(--data "$DATA"); fi
          if [ "$SIMULAR" = "true" ]; then args+=(--dry-run); fi
          python scripts/publicar.py "${args[@]}"
